<div class="bg-gray-100 min-h-screen">
  <h1 class="text-2xl font-bold text-center p-4">TaskFlow</h1>

  <!-- Toggle : liaison bidirectionnelle avec le signal "view" -->
  <div class="flex justify-center mb-4">
    <app-view-toggle [options]="viewOptions" [(selected)]="view" />
  </div>

  <!-- Affichage conditionnel avec @if -->
  @if (view() === 'tasks') {
    <app-project-list />
  } @else {
    <app-user-list />
  }
</div>
