<div class="max-w-4xl mx-auto p-4 space-y-4">
  <input
    type="text"
    placeholder="Rechercher un projet..."
    [(ngModel)]="searchTerm"
    class="border rounded p-2 w-full"
  />

  @if (selectedProject) {
    <p class="bg-blue-100 text-blue-800 rounded p-2">
      Projet sélectionné : {{ selectedProject.name }}
    </p>
  }

  @if (filteredProjects.length === 0) {
    <p class="text-center text-gray-500">Aucun projet trouvé.</p>
  }

@if (filteredProjects().length === 0) {
  <p class="text-center text-gray-500">Aucun projet trouvé.</p>
}

<div class="grid gap-4 md:grid-cols-3">
  @for (project of filteredProjects(); track project.id) {
    <app-project-card
      [project]="project"
      (projectSelected)="onProjectSelected($event)"
    />
  }
</div>
  
  </div>
  <div class="flex gap-2">
  <button (click)="addProject()" class="bg-green-600 text-white rounded px-3 py-1">
    Ajouter un projet
  </button>
  <button (click)="resetProjects()" class="bg-gray-500 text-white rounded px-3 py-1">
    Réinitialiser
  </button>
</div>
