<div class="bg-white rounded-xl shadow p-5 space-y-4">

  <!-- En-tête : infos + badge -->
  <div class="flex justify-between items-start">
    <div>
      <h3 class="text-lg font-bold">{{ user().name }}</h3>
      <p class="text-sm text-gray-500">{{ user().email }}</p>
      <p class="text-sm text-gray-600">{{ user().role }}</p>
    </div>
    <span
      class="text-xs font-semibold rounded-full px-3 py-1"
      [class]="user().active ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'">
      {{ user().active ? 'Actif' : 'Inactif' }}
    </span>
  </div>

  <!-- Les 3 compteurs -->
  <div class="grid grid-cols-3 gap-2 text-center">
    <div class="bg-gray-100 rounded p-2">
      <p class="text-xl font-bold">{{ todoCount() }}</p>
      <p class="text-xs text-gray-500">À faire</p>
    </div>
    <div class="bg-blue-100 rounded p-2">
      <p class="text-xl font-bold">{{ inProgressCount() }}</p>
      <p class="text-xs text-gray-500">En cours</p>
    </div>
    <div class="bg-green-100 rounded p-2">
      <p class="text-xl font-bold">{{ doneCount() }}</p>
      <p class="text-xs text-gray-500">Terminées</p>
    </div>
  </div>

  <!-- Tâches regroupées par projet -->
  <div class="space-y-3">
    @for (project of myProjects(); track project.id) {
      <app-user-project-group [project]="project" [userId]="user().id" />
    } @empty {
      <p class="text-gray-400 italic">Aucune tâche assignée</p>
    }
  </div>

</div>
